  <g transform="translate(1245,111)"><circle cx="20" cy="20" r="19" fill="#16a05d"/><polyline points="10,27 16,21 21,24 29,13" fill="none" stroke="#fff" stroke-width="2"/><text x="57" y="25" class="metric">Tendencia</text></g>
  <g transform="translate(1245,161)"><circle cx="20" cy="20" r="19" fill="#7b3fb1"/><path d="M9 22c4-15 8 15 12 0s8 15 12 0" fill="none" stroke="#fff" stroke-width="2"/><text x="57" y="25" class="metric">Volatilidad</text></g>
  <g transform="translate(1245,211)"><circle cx="20" cy="20" r="19" fill="#1769aa"/><polyline points="10,10 10,30 31,30 14,18" fill="none" stroke="#fff" stroke-width="2"/><text x="57" y="25" class="metric">Drawdown</text></g>
  <g transform="translate(1245,261)"><circle cx="20" cy="20" r="19" fill="#168aad"/><rect x="10" y="20" width="4" height="10" fill="#fff"/><rect x="17" y="14" width="4" height="16" fill="#fff"/><rect x="24" y="8" width="4" height="22" fill="#fff"/><text x="57" y="25" class="metric">Retorno</text></g>
  <g transform="translate(1245,311)"><circle cx="20" cy="20" r="19" fill="#572b86"/><text x="12" y="27" style="font:800 20px Arial;fill:#fff">%</text><text x="57" y="25" class="metric">Riesgo</text></g>
  <text x="1245" y="367" class="metricSmall">Precio · retorno · dispersión</text>

