  <g transform="translate(943,260)"><polyline points="3,8 3,29 30,29" class="iconStroke"/><polyline points="6,13 13,16 19,22 29,27" class="iconStroke"/></g>
  <text x="985" y="271" class="cardtitle">Drawdown</text><text x="985" y="292" class="small">Identificación de caídas</text><text x="985" y="309" class="small">relevantes.</text>
  <g transform="translate(943,344)"><rect x="4" y="15" width="5" height="15" fill="#1769aa"/><rect x="13" y="8" width="5" height="22" fill="#1769aa"/><rect x="22" y="2" width="5" height="28" fill="#1769aa"/></g>
  <text x="985" y="354" class="cardtitle">Distribuciones</text><text x="985" y="375" class="small">Asimetría y valores extremos.</text>

