  <g filter="url(#shadow)"><rect x="920" y="42" width="282" height="354" rx="12" fill="#fff" stroke="#d9e2ec" stroke-width="2"/></g>
  <rect x="920" y="42" width="282" height="43" rx="12" fill="url(#blueHeader)"/><rect x="920" y="73" width="282" height="12" fill="url(#blueHeader)"/>
  <text x="1061" y="69" text-anchor="middle" class="section">E1 · ANÁLISIS EXPLORATORIO</text>
  <g transform="translate(943,113)"><polyline points="2,27 10,19 16,23 28,8" class="iconStroke"/><line x1="2" y1="30" x2="31" y2="30" class="iconStroke"/></g>
  <text x="985" y="122" class="cardtitle">Serie temporal</text><text x="985" y="143" class="small">Evolución del precio.</text>
