  <g filter="url(#shadow)"><rect x="1220" y="420" width="275" height="355" rx="12" fill="#fff" stroke="#d9e2ec" stroke-width="2"/></g>
  <rect x="1220" y="420" width="275" height="43" rx="12" fill="url(#blueHeader)"/><rect x="1220" y="451" width="275" height="12" fill="url(#blueHeader)"/>
  <text x="1357" y="447" text-anchor="middle" class="section">INTERPRETACIÓN</text>
  <text x="1245" y="510" class="cardtitle">✓ Tendencia y ciclos</text><text x="1245" y="532" class="small">Comprender la evolución del precio.</text>
  <text x="1245" y="575" class="cardtitle">✓ Riesgo</text><text x="1245" y="597" class="small">Volatilidad y drawdown.</text>
  <text x="1245" y="640" class="cardtitle">✓ Dependencia</text><text x="1245" y="662" class="small">ACF, PACF y lags relevantes.</text>
  <text x="1245" y="705" class="cardtitle">✓ Evidencia</text><text x="1245" y="727" class="small">Conclusiones con tablas y gráficos.</text>

