  <g transform="translate(292,175)"><text x="42" y="10" class="head">Limpieza</text><text x="42" y="29" class="small">Faltantes, duplicados</text><text x="42" y="44" class="small">y valores inválidos.</text><rect x="4" y="3" width="25" height="27" class="icon"/><line x1="4" y1="12" x2="29" y2="12" class="icon"/><line x1="4" y1="21" x2="29" y2="21" class="icon"/></g>
