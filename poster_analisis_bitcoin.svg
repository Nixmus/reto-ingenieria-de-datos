  <g filter="url(#shadow)"><rect x="620" y="42" width="282" height="354" rx="12" fill="#fff" stroke="#d9e2ec" stroke-width="2"/></g>
  <rect x="620" y="42" width="282" height="43" rx="12" fill="url(#blueHeader)"/><rect x="620" y="73" width="282" height="12" fill="url(#blueHeader)"/>
  <text x="761" y="69" text-anchor="middle" class="section">INGENIERÍA DE CARACTERÍSTICAS</text>
  <g transform="translate(643,113)"><polyline points="3,28 11,20 17,24 28,8" class="iconStroke"/><line x1="3" y1="30" x2="31" y2="30" class="iconStroke"/></g>
  <text x="685" y="122" class="cardtitle">Retornos</text><text x="685" y="143" class="small">Simples y logarítmicos.</text>
  <g transform="translate(643,180)"><polyline points="2,17 7,17 10,8 14,26 18,11 22,20 27,12 31,12" class="iconStroke"/></g>
  <text x="685" y="188" class="cardtitle">Volatilidad</text><text x="685" y="209" class="small">Ventana móvil y anualizada.</text>
  <g transform="translate(643,260)"><polyline points="3,8 3,29 30,29" class="iconStroke"/><polyline points="6,13 13,16 19,22 29,27" class="iconStroke"/></g>
  <text x="685" y="271" class="cardtitle">Drawdown</text><text x="685" y="292" class="small">Caída desde el máximo</text><text x="685" y="309" class="small">acumulado.</text>
  <g transform="translate(643,344)"><rect x="4" y="15" width="5" height="15" fill="#1769aa"/><rect x="13" y="8" width="5" height="22" fill="#1769aa"/><rect x="22" y="2" width="5" height="28" fill="#1769aa"/></g>
  <text x="685" y="354" class="cardtitle">Variables adicionales</text><text x="685" y="375" class="small">Medias móviles y calendario.</text>

