  <rect x="38" y="260" width="95" height="5" rx="2" fill="#1769aa"/>
  <text x="38" y="303" class="subtitle">Ingeniería de datos y</text><text x="38" y="331" class="subtitle">series de tiempo con Python</text>

  <g transform="translate(38,380)"><rect width="32" height="32" rx="7" fill="#e8f1fb"/><rect x="8" y="8" width="16" height="16" class="icon"/><line x1="8" y1="14" x2="24" y2="14" class="icon"/><line x1="14" y1="8" x2="14" y2="24" class="icon"/><text x="45" y="14" class="head">Serie temporal</text><text x="45" y="31" class="small">Observaciones diarias</text><text x="45" y="45" class="small">ordenadas por fecha.</text></g>
  <g transform="translate(38,458)"><rect width="32" height="32" rx="7" fill="#e8f1fb"/><polyline points="7,24 13,18 18,21 25,9" class="icon"/><line x1="7" y1="26" x2="27" y2="26" class="icon"/><text x="45" y="14" class="head">Volatilidad</text><text x="45" y="31" class="small">Magnitud de las</text><text x="45" y="45" class="small">variaciones diarias.</text></g>
  <g transform="translate(38,536)"><rect width="32" height="32" rx="7" fill="#e8f1fb"/><polyline points="7,8 7,25 26,25" class="icon"/><polyline points="9,14 15,17 20,22 26,24" class="icon"/><text x="45" y="14" class="head">Drawdown</text><text x="45" y="31" class="small">Caída desde un</text><text x="45" y="45" class="small">máximo histórico.</text></g>
  <g transform="translate(38,614)"><rect width="32" height="32" rx="7" fill="#fff1d6"/><text x="7" y="23" style="font:800 19px Arial;fill:#d97706">Py</text><text x="45" y="14" class="head">Python</text><text x="45" y="31" class="small">Análisis, visualización</text><text x="45" y="45" class="small">y modelamiento.</text></g>
  <g transform="translate(38,692)"><rect width="32" height="32" rx="7" fill="#eee8fb"/><text x="6" y="23" style="font:800 18px Arial;fill:#572b86">&lt;/&gt;</text><text x="45" y="14" class="head">Herramientas</text><text x="45" y="31" class="small">pandas · numpy ·</text><text x="45" y="45" class="small">statsmodels · sklearn</text></g>
  <rect x="28" y="820" width="215" height="125" rx="12" fill="#eaf3ff"/><circle cx="60" cy="855" r="18" fill="#1769aa"/><circle cx="60" cy="855" r="7" fill="none" stroke="#fff" stroke-width="2"/><circle cx="60" cy="855" r="13" fill="none" stroke="#fff" stroke-width="2"/><text x="91" y="853" class="head">OBJETIVO</text><text x="46" y="883" class="small">Construir y analizar una serie</text><text x="46" y="900" class="small">temporal de Bitcoin para</text><text x="46" y="917" class="small">comprender su comportamiento.</text>

