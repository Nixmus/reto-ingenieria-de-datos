  <g transform="translate(958,510)"><rect x="0" y="20" width="24" height="24" fill="none" stroke="#7b3fb1" stroke-width="3"/><rect x="28" y="0" width="24" height="24" fill="none" stroke="#7b3fb1" stroke-width="3"/><line x1="24" y1="32" x2="28" y2="16" stroke="#7b3fb1" stroke-width="3"/><text x="0" y="74" class="small">Selección</text><text x="5" y="91" class="small">de modelos</text></g>
  <g transform="translate(1100,510)"><circle cx="22" cy="22" r="16" fill="none" stroke="#7b3fb1" stroke-width="3"/><path d="M22 8v28M8 22h28" stroke="#7b3fb1" stroke-width="3"/><text x="-8" y="74" class="small">Entrenamiento</text></g>
  <g transform="translate(1244,510)"><rect x="4" y="4" width="36" height="35" rx="5" fill="none" stroke="#7b3fb1" stroke-width="3"/><path d="M13 22l7 7 13-15" fill="none" stroke="#7b3fb1" stroke-width="3"/><text x="2" y="74" class="small">Validación</text></g>
  <g transform="translate(1378,510)"><polyline points="0,45 0,10 46,10" fill="none" stroke="#7b3fb1" stroke-width="3"/><polyline points="10,35 22,25 29,29 43,14" fill="none" stroke="#7b3fb1" stroke-width="3"/><text x="5" y="74" class="small">Pronóstico</text></g>
  <line x1="970" y1="635" x2="1135" y2="635" stroke="#b0b9c5" stroke-width="2"/><text x="1207" y="645" text-anchor="middle" style="font:800 24px Arial;fill:#572b86">Baseline temporal</text><line x1="1280" y1="635" x2="1445" y2="635" stroke="#b0b9c5" stroke-width="2"/>
  <text x="982" y="685" class="cardtitle">• Split cronológico 80/20</text><text x="982" y="715" class="cardtitle">• MAE · RMSE · MAPE</text><text x="1220" y="685" class="cardtitle">• Sin barajar datos</text><text x="1220" y="715" class="cardtitle">• Sin fuga temporal</text>

