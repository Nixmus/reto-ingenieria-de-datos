<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Análisis temporal de Bitcoin</title>
  <desc id="desc">Póster académico sobre ingeniería de datos y series de tiempo con Python.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="blueHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#114b9b"/><stop offset="1" stop-color="#1769aa"/>
    </linearGradient>
    <linearGradient id="purpleHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#572b86"/><stop offset="1" stop-color="#7b3fb1"/>
    </linearGradient>
    <style>
      .title{font:800 49px Arial,sans-serif;fill:#102a72;letter-spacing:1px}
      .subtitle{font:700 23px Arial,sans-serif;fill:#243b53}
      .section{font:800 16px Arial,sans-serif;fill:#fff}
      .cardtitle{font:800 18px Arial,sans-serif;fill:#102a72}
      .body{font:400 15px Arial,sans-serif;fill:#243b53}
      .small{font:400 13px Arial,sans-serif;fill:#52606d}
      .metric{font:800 17px Arial,sans-serif;fill:#243b53}
      .metricSmall{font:400 13px Arial,sans-serif;fill:#52606d}
      .footer{font:800 15px Arial,sans-serif;fill:#102a72}
      .iconStroke{stroke:#1261a0;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1536" height="1024" fill="#ffffff"/>
  <rect x="0" y="0" width="1536" height="8" fill="#123f82"/>

  <!-- Left title column -->
  <text x="42" y="83" class="title">ANÁLISIS</text>
  <text x="42" y="137" class="title">TEMPORAL</text>
  <text x="42" y="191" class="title">DE</text>
  <text x="42" y="245" class="title">BITCOIN</text>
  <rect x="45" y="274" width="118" height="5" rx="2" fill="#1769aa"/>
  <text x="45" y="324" class="subtitle">Ingeniería de datos y</text>
  <text x="45" y="354" class="subtitle">series de tiempo con Python</text>

  <!-- Left concepts -->
  <g transform="translate(45,410)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#e8f1fb"/>
    <rect x="10" y="10" width="18" height="18" class="iconStroke"/>
    <line x1="10" y1="16" x2="28" y2="16" class="iconStroke"/><line x1="16" y1="10" x2="16" y2="28" class="iconStroke"/>
    <text x="54" y="18" class="cardtitle">Serie temporal</text><text x="54" y="38" class="small">Observaciones diarias ordenadas</text><text x="54" y="54" class="small">por fecha de Bitcoin.</text>
  </g>
  <g transform="translate(45,490)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#e8f1fb"/>
    <polyline points="8,28 15,22 21,25 28,10" class="iconStroke"/><line x1="8" y1="30" x2="31" y2="30" class="iconStroke"/>
    <text x="54" y="18" class="cardtitle">Volatilidad</text><text x="54" y="38" class="small">Magnitud de las variaciones</text><text x="54" y="54" class="small">diarias del retorno.</text>
  </g>
  <g transform="translate(45,570)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#e8f1fb"/>
    <polyline points="8,10 8,29 30,29" class="iconStroke"/><polyline points="10,16 17,19 22,25 29,28" class="iconStroke"/>
    <text x="54" y="18" class="cardtitle">Drawdown</text><text x="54" y="38" class="small">Caída desde un máximo</text><text x="54" y="54" class="small">histórico hasta un mínimo.</text>
  </g>
  <g transform="translate(45,650)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#fff1d6"/>
    <text x="10" y="28" style="font:800 24px Arial;fill:#d97706">Py</text>
    <text x="54" y="18" class="cardtitle">Python</text><text x="54" y="38" class="small">Lenguaje para análisis,</text><text x="54" y="54" class="small">visualización y modelamiento.</text>
  </g>
  <g transform="translate(45,730)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#eee8fb"/>
    <text x="9" y="27" style="font:800 25px Arial;fill:#572b86">&lt;/&gt;</text>
    <text x="54" y="18" class="cardtitle">Herramientas clave</text><text x="54" y="38" class="small">pandas · numpy · matplotlib</text><text x="54" y="54" class="small">statsmodels · scikit-learn</text>
  </g>

  <!-- Objective box -->
  <rect x="35" y="845" width="257" height="125" rx="12" fill="#eaf3ff"/>
  <circle cx="70" cy="883" r="19" fill="#1769aa"/>
  <circle cx="70" cy="883" r="7" fill="none" stroke="#fff" stroke-width="2"/><circle cx="70" cy="883" r="13" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="103" y="881" class="cardtitle">OBJETIVO</text>
  <text x="55" y="914" class="small">Construir, analizar y modelar</text><text x="55" y="932" class="small">una serie temporal de Bitcoin</text><text x="55" y="950" class="small">para comprender su comportamiento.</text>

  <!-- Main columns -->
  <!-- Card 1 -->
  <g filter="url(#shadow)"><rect x="320" y="42" width="282" height="354" rx="12" fill="#fff" stroke="#d9e2ec" stroke-width="2"/></g>
  <rect x="320" y="42" width="282" height="43" rx="12" fill="url(#blueHeader)"/><rect x="320" y="73" width="282" height="12" fill="url(#blueHeader)"/>
  <text x="461" y="69" text-anchor="middle" class="section">E0 · PREPARACIÓN Y CALIDAD</text>
  <g transform="translate(343,111)"><ellipse cx="16" cy="7" rx="14" ry="6" class="iconStroke"/><path d="M2 7v16c0 4 28 4 28 0V7" class="iconStroke"/><ellipse cx="16" cy="23" rx="14" ry="6" class="iconStroke"/></g>
  <text x="385" y="122" class="cardtitle">Adquisición</text><text x="385" y="143" class="small">CSV histórico de Bitcoin.</text>
  <g transform="translate(343,177)"><rect x="3" y="3" width="27" height="27" class="iconStroke"/><line x1="3" y1="12" x2="30" y2="12" class="iconStroke"/><line x1="3" y1="21" x2="30" y2="21" class="iconStroke"/><line x1="12" y1="3" x2="12" y2="30" class="iconStroke"/><line x1="21" y1="3" x2="21" y2="30" class="iconStroke"/></g>
  <text x="385" y="188" class="cardtitle">Limpieza</text><text x="385" y="209" class="small">Faltantes, duplicados y</text><text x="385" y="226" class="small">precios no positivos.</text>
  <g transform="translate(343,260)"><rect x="4" y="7" width="25" height="22" class="iconStroke"/><line x1="9" y1="3" x2="9" y2="11" class="iconStroke"/><line x1="24" y1="3" x2="24" y2="11" class="iconStroke"/><line x1="4" y1="14" x2="29" y2="14" class="iconStroke"/></g>
  <text x="385" y="271" class="cardtitle">Alineación temporal</text><text x="385" y="292" class="small">Orden cronológico y</text><text x="385" y="309" class="small">frecuencia diaria.</text>
  <g transform="translate(343,343)"><path d="M16 2l13 5v9c0 8-6 13-13 16C9 29 3 24 3 16V7z" class="iconStroke"/><path d="M9 16l5 5 9-10" class="iconStroke"/></g>
  <text x="385" y="354" class="cardtitle">Validación</text><text x="385" y="375" class="small">Consistencia y trazabilidad.</text>

