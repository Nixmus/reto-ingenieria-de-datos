  <rect x="530" y="35" width="240" height="40" rx="12" fill="url(#blue)"/><rect x="530" y="62" width="240" height="13" fill="url(#blue)"/><text x="650" y="61" text-anchor="middle" class="bar">CARACTERÍSTICAS</text>
  <rect x="790" y="35" width="240" height="40" rx="12" fill="url(#blue)"/><rect x="790" y="62" width="240" height="13" fill="url(#blue)"/><text x="910" y="61" text-anchor="middle" class="bar">E1 · EXPLORACIÓN</text>
  <rect x="1050" y="35" width="240" height="40" rx="12" fill="#102a72"/><rect x="1050" y="62" width="240" height="13" fill="#102a72"/><text x="1170" y="61" text-anchor="middle" class="bar">MÉTRICAS CLAVE</text>

