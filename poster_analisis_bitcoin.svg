  <text x="420" y="505" class="cardtitle">ACF</text><text x="603" y="505" class="cardtitle">PACF</text><text x="785" y="505" class="cardtitle">Lag plots</text>
  <text x="350" y="537" class="small">Autocorrelación</text><text x="532" y="537" class="small">Autocorrelación parcial</text><text x="735" y="537" class="small">Relación con retrasos</text>
  <!-- mini acf -->
  <g transform="translate(350,570)"><line x1="0" y1="105" x2="125" y2="105" stroke="#243b53" stroke-width="2"/><line x1="0" y1="105" x2="0" y2="0" stroke="#243b53" stroke-width="2"/><line x1="15" y1="105" x2="15" y2="15" stroke="#15915d" stroke-width="7"/><line x1="35" y1="105" x2="35" y2="35" stroke="#15915d" stroke-width="7"/><line x1="55" y1="105" x2="55" y2="50" stroke="#15915d" stroke-width="7"/><line x1="75" y1="105" x2="75" y2="68" stroke="#15915d" stroke-width="7"/><line x1="95" y1="105" x2="95" y2="80" stroke="#15915d" stroke-width="7"/><text x="4" y="126" class="small">Lag</text><text x="-2" y="-7" class="small">ACF</text></g>
  <!-- mini pacf -->
  <g transform="translate(532,570)"><line x1="0" y1="105" x2="125" y2="105" stroke="#243b53" stroke-width="2"/><line x1="0" y1="105" x2="0" y2="0" stroke="#243b53" stroke-width="2"/><line x1="15" y1="105" x2="15" y2="19" stroke="#15915d" stroke-width="7"/><line x1="35" y1="105" x2="35" y2="60" stroke="#15915d" stroke-width="7"/><line x1="55" y1="105" x2="55" y2="85" stroke="#15915d" stroke-width="7"/><line x1="75" y1="105" x2="75" y2="96" stroke="#15915d" stroke-width="7"/><text x="4" y="126" class="small">Lag</text><text x="-2" y="-7" class="small">PACF</text></g>
  <!-- lag scatter -->
  <g transform="translate(735,570)"><line x1="0" y1="105" x2="125" y2="105" stroke="#243b53" stroke-width="2"/><line x1="0" y1="105" x2="0" y2="0" stroke="#243b53" stroke-width="2"/><line x1="10" y1="95" x2="115" y2="10" stroke="#7b3fb1" stroke-width="2" stroke-dasharray="5 4"/><circle cx="18" cy="91" r="4" fill="#15915d"/><circle cx="30" cy="80" r="4" fill="#15915d"/><circle cx="43" cy="75" r="4" fill="#15915d"/><circle cx="55" cy="61" r="4" fill="#15915d"/><circle cx="68" cy="55" r="4" fill="#15915d"/><circle cx="81" cy="45" r="4" fill="#15915d"/><circle cx="94" cy="34" r="4" fill="#15915d"/><circle cx="106" cy="25" r="4" fill="#15915d"/><text x="4" y="126" class="small">Precio t-k</text><text x="-2" y="-7" class="small">Precio t</text></g>
  <text x="350" y="730" class="small">Los lags permiten identificar persistencia, memoria y relación entre valores actuales y pasados.</text>

