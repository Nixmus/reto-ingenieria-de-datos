  <g filter="url(#shadow)"><rect x="920" y="420" width="575" height="355" rx="12" fill="#fff" stroke="#d9e2ec" stroke-width="2"/></g>
  <rect x="920" y="420" width="575" height="43" rx="12" fill="url(#purpleHeader)"/><rect x="920" y="451" width="575" height="12" fill="url(#purpleHeader)"/>
