<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Análisis temporal de Bitcoin</title>
  <desc id="desc">Póster académico sobre ingeniería de datos y series de tiempo con Python, organizado sin superposición de elementos.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity=".15"/></filter>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#114b9b"/><stop offset="1" stop-color="#1769aa"/></linearGradient>
    <linearGradient id="purple" x1="0" x2="1"><stop offset="0" stop-color="#572b86"/><stop offset="1" stop-color="#7b3fb1"/></linearGradient>
    <style>
